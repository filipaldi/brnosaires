name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -t .

      - name: Build with Pelican
        run: |
          PYTHONPATH=. pelican content -s publishconf.py

      # Runs before the artifact upload on purpose: a broken reference must
      # stop the deploy, not ship and get reported afterwards. `deploy` needs
      # `build`, so a red check here leaves the previous site live.
      - name: Check internal references
        run: python scripts/check_links.py output

      - name: Add CNAME for custom domain
        run: echo "brnosaires.com" > output/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
          # Since v4 this action tars with `--exclude=.[^/]*`, so every
          # dotfile is dropped — including the whole `.well-known/` directory
          # that plugins/llm_ally.py has been writing since May. The build
          # produced it, the deploy succeeded, and the live site answered 404;
          # nothing anywhere reported a problem. `.well-known` is also where
          # NIP-05 and any webfinger file have to live, so this is a
          # precondition for those, not just a lost mirror.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && needs.build.outputs.tests == 'failure'
    steps:
      - name: The suite failed
        run: |
          echo "The site is published. The suite is red - fix it."
          exit 1
