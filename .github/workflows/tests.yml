name: Tests

# Runs on every push and pull request, and is a required gate for the deploy:
# deploy.yml calls the same suite before it builds the artifact. Standard
# library `unittest`, so there is no test-runner dependency to keep pinned.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -r requirements.txt
          # The Nostr signing tests skip themselves without these; installing
          # them here means they actually run.
          pip install -r requirements-social.txt

      - name: Run
        run: python -m unittest discover -s tests -t . -v
