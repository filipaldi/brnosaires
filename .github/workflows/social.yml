name: Echo to Mastodon and Nostr

# Runs after a successful deploy, and reads the LIVE feed rather than a local
# build: nothing gets announced that a reader cannot already open.
#
# With no secrets set this is a no-op that logs one line — which is its state
# until someone picks the account this site posts as. Nothing here can fail the
# site; the deploy has already finished by the time it starts.
on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Shared with convert-images.yml: both commit to main. Serialising them is what
# stops a rejected push here from losing the record of what was already posted
# — which on Nostr would mean announcing the same article twice.
concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  echo:
    # `workflow_run` fires for failed runs, and for manual dispatches of the
    # deploy from ANY branch — which would post the live feed to the world off
    # the back of a feature-branch experiment.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements-social.txt

      - name: Publish
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
          NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
        run: python scripts/publish_social.py

      - name: Remember what went out
        run: |
          if [ -z "$(git status --porcelain .published-feeds.json)" ]; then
            echo "Nothing new was announced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .published-feeds.json
          git commit -m "Record announced articles

          Automatic: scripts/publish_social.py echoed new articles to the
          configured networks."
          # The posts have already gone out. Losing this file means the next
          # run announces them again, so the push retries rather than failing.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt), rebasing on main"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts — the next run may repeat these posts"
          exit 1
