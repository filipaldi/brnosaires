# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS — editorské rozhraní nad tímhle repem.
# Otevři https://brnosaires.com/admin/ a přihlas se GitHub účtem.
#
# Poznámky pro vývojáře (proč to je takhle):
#
#   modes: [raw] u každého těla článku. V obsahu je 125 výskytů vlastních
#   widget tagů (<widget-calendar/>, <widget-gallery/>, …). Rich-text editor
#   je Markdown↔HTML round-trip a vlastní tagy neumí zachovat, takže by je
#   při prvním uložení přepsal. Raw režim žádný round-trip nedělá.
#
#   i18n.structure: multiple_files zapisuje /<folder>/<path>.<locale>.<ext>,
#   což je přesně naše konvence `foo.en.md` se stejným slugem. Spolu
#   s omit_default_locale_from_file_path zůstává česká verze jako `foo.md`.
#
#   Přihlášení: GitHub backend nabízí „Sign In with Token“ (osobní přístupový
#   token), takže tenhle web nepotřebuje žádný OAuth relay ani nic dalšího
#   hostovat. Kdyby se někdy chtělo klasické „Přihlásit přes GitHub“, přibude
#   sem `base_url:` na nasazený sveltia-cms-auth.

backend:
  name: github
  repo: filipaldi/brnosaires
  branch: main
  # Commituje rovnou do main — web se od té chvíle staví při každém pushi
  # (.github/workflows/deploy.yml), takže změna je venku za pár minut.

media_folder: content/images
public_folder: /images

output:
  # Prázdné nepovinné pole se nezapisuje. Sveltia jinak uloží `series: ''`
  # a Pelican uvozovky nesundává, takže web dostane dvouznakový řetězec `''`
  # a udělá z něj skutečnou hodnotu — odkaz na /series/''.
  omit_empty_optional_fields: true
  yaml:
    quote: none
    # NENÍ to kosmetika. Pelican čte metadata rozšířením `meta` z Markdownu
    # a to pokračuje v hodnotě jen na řádku odsazeném 4+ mezerami. Při 2
    # se parsování zastaví na první položce seznamu (`instructor_slugs`)
    # a všechna pole pod ní tiše vypadnou z metadat do těla stránky.
    indent_size: 4

i18n:
  structure: multiple_files
  locales: [cs, en]
  default_locale: cs
  omit_default_locale_from_file_path: true

collections:
  - name: events
    label: Akce
    label_singular: Akci
    folder: content/events
    # Marathon je anglický sub-web s `translate: false` (EXTRA_PATH_METADATA).
    # Přes tuhle dvojjazyčnou kolekci by dostal /en/ dvojče, které mít nesmí.
    filter: { field: translate, value: null }
    # Rok a měsíc se berou z data KONÁNÍ, ne z data publikace — repo je
    # tříděné podle měsíce akce.
    path: "{{event-start | date('YYYY')}}/{{event-start | date('MM')}}/{{slug}}"
    create: true
    format: yaml-frontmatter
    extension: md
    i18n: true
    summary: "{{title}} — {{event-start | date('D. M. YYYY')}}"
    sortable_fields: [event-start, title]
    # Bez filtrů je to jeden nerozlišený seznam přes sto akcí a editor v něm
    # hledá očima. Hodnoty musí sedět s options u pole event-type níž.
    view_filters:
      - { label: Milongy, field: event-type, pattern: milonga }
      - { label: Neolongy, field: event-type, pattern: neolonga }
      - { label: Workshopy, field: event-type, pattern: workshop }
      - { label: Lekce, field: event-type, pattern: class }
      - { label: Praktiky, field: event-type, pattern: praktika }
    view_groups:
      - { label: Typ akce, field: event-type }
    fields:
      - name: lang
        label: Jazyk
        widget: hidden
        # NOT optional. Pelican links a Czech file and its .en.md twin by slug
        # + this field; without it both count as originals with the same slug
        # and the build dies with FileOverwriteFailedError. Sveltia writes only
        # declared fields, so leaving it out would also strip it from the 28
        # existing .en.md events on their first save.
        # `{{locale}}` rather than a literal: a hidden field has one default
        # for every locale, so `cs` was written into the .en.md twin as well
        # and brought the build down in exactly the way described above.
        default: '{{locale}}'
        i18n: translate
      - { name: title, label: Název, widget: string, i18n: true }
      - name: slug
        label: Slug (v URL)
        widget: string
        i18n: duplicate
        hint: Bez diakritiky, malými písmeny s pomlčkami. Česká i anglická verze mají stejný slug.
      - name: date
        label: Datum publikace
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
        hint: Kdy soubor zakládáš, NE kdy je akce. Datum akce patří do „Začátek".
      - name: author
        label: Autor
        widget: select
        i18n: duplicate
        options: [Lenka Pláteníková, Filip Paldia, Michaela Lukavská]
      - name: description
        label: Krátký popis
        widget: text
        i18n: true
        hint: Do ~200 znaků. Jde do Googlu a do náhledu na sítích.
      - name: preview_image
        label: Náhledový obrázek
        widget: image
        required: false
        i18n: duplicate
        hint: 1200×630. Nahraj v jakémkoli formátu — robot ho převede na .avif.
      - name: event-type
        label: Typ akce
        widget: select
        i18n: duplicate
        options: [milonga, neolonga, workshop, class, praktika]
        hint: Jednorázová intenzivní akce = workshop. Pravidelná týdenní lekce = class.
      - name: event-start
        label: Začátek
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
      - name: event-end
        label: Konec
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
        hint: Půlnoc piš jako 00:00:00 dalšího dne.
      - name: event-location
        label: Místo
        widget: select
        i18n: duplicate
        # Kanonický seznam míst. Volný text tady nejde zadat schválně —
        # `event_address()` v pelicanconf.py z téhle věty skládá schema.org
        # adresu podle čárek a odchylka od tvaru „Podnik, Ulice, Brno-Čtvrť"
        # tiše degraduje strukturovaná data. Nové místo přidej sem.
        options:
          - Adrinela Cafe, Životského 14, Brno-Židenice
          - Café Paměti národa, Radnická 10, Brno
          - Dělnický dům, Jamborova 65, Brno
          - Domini Park, Husova 14, Brno
          - HEX Gallery, Lidická 63a, Brno
          - i.D Yoga, Poštovská 3, Brno
          - Kancelář ombudsmana (předsálí), Údolní 39, Brno
          - Kavárna Hned vedle, Radnická 10, Brno
          - Park Anthropos, Pisárecká 5, Brno
          - Park Moravské náměstí, Brno
          - Pavilon Anthropos, Pisárecká 5, Brno
          - Rockwine, Vídeňská 18, Brno
          - Sesamo Bakery, Purkyňova 97c, Brno-Královo Pole
          - Skleněnka, Kounicova 23, Brno
          - Škola Danza, Okružní 1, Brno
          - Společenský sál na Staré radnici, Dominikánská 264/2, Brno-město
          - Stará radnice, Radnická 8, Brno
          - Střecha Vaňkovky, Brno
          - Taneční studio Stolárna, Olomoucká 14, Brno
          - Vlněna, Přízova 216/18, Brno
      - name: event-organiser
        label: Pořadatel
        widget: string
        required: false
        i18n: duplicate
      - name: instructor_slugs
        label: Lektoři
        widget: relation
        collection: people
        multiple: true
        required: false
        i18n: duplicate
        hint: >-
          Vyber z profilů v Lidé. Jméno v hlavičce akce se vypíše přesně tak,
          jak ho má profil, a akce se zároveň objeví na stránce toho lektora.
          Kdo v nabídce chybí, musí nejdřív dostat profil v Lidech.
      - name: entry
        label: Vstupné
        widget: string
        required: false
        i18n: true
        hint: '„zdarma" nebo „dobrovolné" označí akci jako bezplatnou.'
      - name: event-url
        label: Externí odkaz (vstupenky, registrace)
        widget: string
        required: false
        i18n: duplicate
      - name: series
        label: Série
        widget: select
        required: false
        i18n: duplicate
        options: [milonga-adrinela, milonga-rockwine, milonga-u-draka, neolonga-na-stolarne, tango-pizza]
        hint: Vyplň jen u akce, která patří do pravidelné série s vlastní hub-stránkou.
      - name: recurrence
        label: Opakování
        widget: string
        required: false
        i18n: duplicate
        hint: >-
          Jen u pravidelných lekcí. Tvar „weekly monday" nebo „monthly 1 sunday",
          volitelně + „from 2026-09-07", „until 2026-12-16" nebo „count 10".
          JEDEN soubor pokryje všechny termíny — nezakládej je ručně.
      - name: body
        label: Text
        widget: markdown
        modes: [raw]
        i18n: true


  # Pravidelné lekce jsou vlastní typ obsahu, ne podmnožina akcí: leží v
  # content/events/classes/, v názvu nemají datum (dodá ho recurrence) a
  # nepatří do struktury RRRR/MM/, podle které se zakládají jednorázové akce.
  # Jako samostatná kolekce je editor najde v postranním panelu místo aby je
  # lovil mezi stovkou akcí.
  - name: classes
    label: Pravidelné lekce
    label_singular: Lekci
    folder: content/events/classes
    create: true
    format: yaml-frontmatter
    extension: md
    i18n: true
    summary: "{{title}} — {{recurrence}}"
    sortable_fields: [title, event-start]
    fields:
      - name: lang
        label: Jazyk
        widget: hidden
        # NOT optional. Pelican links a Czech file and its .en.md twin by slug
        # + this field; without it both count as originals with the same slug
        # and the build dies with FileOverwriteFailedError. Sveltia writes only
        # declared fields, so leaving it out would also strip it from the 28
        # existing .en.md events on their first save.
        # `{{locale}}` rather than a literal: a hidden field has one default
        # for every locale, so `cs` was written into the .en.md twin as well
        # and brought the build down in exactly the way described above.
        default: '{{locale}}'
        i18n: translate
      - { name: title, label: Název, widget: string, i18n: true }
      - name: slug
        label: Slug (v URL)
        widget: string
        i18n: duplicate
        hint: Bez diakritiky, malými písmeny s pomlčkami. Česká i anglická verze mají stejný slug.
      - name: date
        label: Datum publikace
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
        hint: Kdy soubor zakládáš, NE kdy je akce. Datum akce patří do „Začátek".
      - name: author
        label: Autor
        widget: select
        i18n: duplicate
        options: [Lenka Pláteníková, Filip Paldia, Michaela Lukavská]
      - name: description
        label: Krátký popis
        widget: text
        i18n: true
        hint: Do ~200 znaků. Jde do Googlu a do náhledu na sítích.
      - name: preview_image
        label: Náhledový obrázek
        widget: image
        required: false
        i18n: duplicate
        hint: 1200×630. Nahraj v jakémkoli formátu — robot ho převede na .avif.
      - name: event-type
        label: Typ akce
        widget: select
        i18n: duplicate
        options: [milonga, neolonga, workshop, class, praktika]
        default: class
        hint: U pravidelné lekce skoro vždy „class“. Praktika má vlastní typ.
      - name: event-start
        label: Začátek
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
      - name: event-end
        label: Konec
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        i18n: duplicate
        hint: Půlnoc piš jako 00:00:00 dalšího dne.
      - name: event-location
        label: Místo
        widget: select
        i18n: duplicate
        # Kanonický seznam míst. Volný text tady nejde zadat schválně —
        # `event_address()` v pelicanconf.py z téhle věty skládá schema.org
        # adresu podle čárek a odchylka od tvaru „Podnik, Ulice, Brno-Čtvrť"
        # tiše degraduje strukturovaná data. Nové místo přidej sem.
        options:
          - Adrinela Cafe, Životského 14, Brno-Židenice
          - Café Paměti národa, Radnická 10, Brno
          - Dělnický dům, Jamborova 65, Brno
          - Domini Park, Husova 14, Brno
          - HEX Gallery, Lidická 63a, Brno
          - i.D Yoga, Poštovská 3, Brno
          - Kancelář ombudsmana (předsálí), Údolní 39, Brno
          - Kavárna Hned vedle, Radnická 10, Brno
          - Park Anthropos, Pisárecká 5, Brno
          - Park Moravské náměstí, Brno
          - Pavilon Anthropos, Pisárecká 5, Brno
          - Rockwine, Vídeňská 18, Brno
          - Sesamo Bakery, Purkyňova 97c, Brno-Královo Pole
          - Skleněnka, Kounicova 23, Brno
          - Škola Danza, Okružní 1, Brno
          - Společenský sál na Staré radnici, Dominikánská 264/2, Brno-město
          - Stará radnice, Radnická 8, Brno
          - Střecha Vaňkovky, Brno
          - Taneční studio Stolárna, Olomoucká 14, Brno
          - Vlněna, Přízova 216/18, Brno
      - name: event-organiser
        label: Pořadatel
        widget: string
        required: false
        i18n: duplicate
      - name: instructor_slugs
        label: Lektoři
        widget: relation
        collection: people
        multiple: true
        required: false
        i18n: duplicate
        hint: >-
          Vyber z profilů v Lidé. Jméno v hlavičce akce se vypíše přesně tak,
          jak ho má profil, a akce se zároveň objeví na stránce toho lektora.
          Kdo v nabídce chybí, musí nejdřív dostat profil v Lidech.
      - name: entry
        label: Vstupné
        widget: string
        required: false
        i18n: true
        hint: '„zdarma" nebo „dobrovolné" označí akci jako bezplatnou.'
      - name: event-url
        label: Externí odkaz (vstupenky, registrace)
        widget: string
        required: false
        i18n: duplicate
      - name: series
        label: Série
        widget: select
        required: false
        i18n: duplicate
        options: [milonga-adrinela, milonga-rockwine, milonga-u-draka, neolonga-na-stolarne, tango-pizza]
        hint: Vyplň jen u akce, která patří do pravidelné série s vlastní hub-stránkou.
      - name: recurrence
        label: Opakování
        widget: string
        # Povinné: bez něj se z pravidelné lekce stane jeden termín.
        required: true
        i18n: duplicate
        pattern: ['^(weekly (monday|tuesday|wednesday|thursday|friday|saturday|sunday)|monthly (-1|[1-4]) (monday|tuesday|wednesday|thursday|friday|saturday|sunday))( (from|until) \d{4}-\d{2}-\d{2}| count \d+)*$', 'Tvar „weekly monday“ nebo „monthly 1 sunday“, dny anglicky. Volitelně „until 2026-12-16“, „count 10“, „from 2026-09-07“.']
        hint: >-
          Den musí sedět se dnem, na který padá Začátek. Konec série:
          „weekly monday count 10“ nebo „weekly monday until 2026-12-16“.
      - name: body
        label: Text
        widget: markdown
        modes: [raw]
        i18n: true

  - name: announcements
    label: Oznámení
    label_singular: Oznámení
    folder: content/announcements
    create: true
    format: yaml-frontmatter
    extension: md
    i18n: true
    fields:
      - name: lang
        label: Jazyk
        widget: hidden
        # NOT optional. Pelican links a Czech file and its .en.md twin by slug
        # + this field; without it both count as originals with the same slug
        # and the build dies with FileOverwriteFailedError. Sveltia writes only
        # declared fields, so leaving it out would also strip it from the 28
        # existing .en.md events on their first save.
        # `{{locale}}` rather than a literal: a hidden field has one default
        # for every locale, so `cs` was written into the .en.md twin as well
        # and brought the build down in exactly the way described above.
        default: '{{locale}}'
        i18n: translate
      - { name: title, label: Název, widget: string, i18n: true }
      - { name: date, label: Datum publikace, widget: datetime, format: 'YYYY-MM-DD HH:mm:ss', i18n: duplicate }
      - name: author
        label: Autor
        widget: select
        i18n: duplicate
        options: [Lenka Pláteníková, Filip Paldia, Michaela Lukavská]
      - { name: category, label: Kategorie, widget: hidden, default: announcement, i18n: duplicate }
      - { name: description, label: Krátký popis, widget: text, i18n: true }
      - { name: preview_image, label: Náhledový obrázek, widget: image, required: false, i18n: duplicate }
      - { name: body, label: Text, widget: markdown, modes: [raw], i18n: true }

  - name: curiosities
    label: Píkošky
    label_singular: Píkošku
    folder: content/curiosities
    create: true
    format: yaml-frontmatter
    extension: md
    i18n: true
    # Obrázek píkošky smí bydlet vedle .md (viz plugins/colocated_images.py),
    # ale CMS ho ukládá do content/images/ jako všechno ostatní — jednodušší
    # a vždycky správné.
    fields:
      - name: lang
        label: Jazyk
        widget: hidden
        # NOT optional. Pelican links a Czech file and its .en.md twin by slug
        # + this field; without it both count as originals with the same slug
        # and the build dies with FileOverwriteFailedError. Sveltia writes only
        # declared fields, so leaving it out would also strip it from the 28
        # existing .en.md events on their first save.
        # `{{locale}}` rather than a literal: a hidden field has one default
        # for every locale, so `cs` was written into the .en.md twin as well
        # and brought the build down in exactly the way described above.
        default: '{{locale}}'
        i18n: translate
      - { name: title, label: Název, widget: string, i18n: true }
      - { name: date, label: Datum publikace, widget: datetime, format: 'YYYY-MM-DD HH:mm:ss', i18n: duplicate }
      - name: author
        label: Autor
        widget: select
        i18n: duplicate
        options: [Lenka Pláteníková, Filip Paldia, Michaela Lukavská]
      - { name: category, label: Kategorie, widget: hidden, default: curiosity, i18n: duplicate }
      - { name: description, label: Krátký popis, widget: text, i18n: true }
      - { name: preview_image, label: Náhledový obrázek, widget: image, required: false, i18n: duplicate }
      - name: llm_mirror
        label: Zrcadlit pro LLM
        widget: boolean
        required: false
        i18n: duplicate
        hint: Vypnuto = stránka se nezrcadlí do /llms.txt.
      - { name: body, label: Text, widget: markdown, modes: [raw], i18n: true }

  - name: people
    label: Lidé
    label_singular: Osobu
    folder: content/people
    create: true
    format: yaml-frontmatter
    extension: md
    i18n: true
    fields:
      - name: lang
        label: Jazyk
        widget: hidden
        # NOT optional. Pelican links a Czech file and its .en.md twin by slug
        # + this field; without it both count as originals with the same slug
        # and the build dies with FileOverwriteFailedError. Sveltia writes only
        # declared fields, so leaving it out would also strip it from the 28
        # existing .en.md events on their first save.
        # `{{locale}}` rather than a literal: a hidden field has one default
        # for every locale, so `cs` was written into the .en.md twin as well
        # and brought the build down in exactly the way described above.
        default: '{{locale}}'
        i18n: translate
      - { name: title, label: Jméno, widget: string, i18n: true }
      # No `slug` field on purpose. A profile is addressed by its filename,
      # and that filename is also what an event's `instructor_slugs` relation
      # stores. A slug typed by hand would differ from it, and the event
      # naming that profile would then stop the build. None of the profiles
      # ever carried one, so nothing is lost by not offering it.
      # Not required: no profile carries an author, and marking either field
      # required would make every existing one un-saveable until the editor
      # invents a value for it.
      - { name: date, label: Datum publikace, widget: datetime, format: 'YYYY-MM-DD HH:mm:ss', required: false, i18n: duplicate }
      - name: author
        label: Autor
        widget: select
        required: false
        i18n: duplicate
        options: [Lenka Pláteníková, Filip Paldia, Michaela Lukavská]
      # Not required: three profiles carry no description, because nobody
      # knows a true sentence to write about them yet. A required field would
      # make those three un-saveable until the editor invents one.
      - { name: description, label: Krátký popis, widget: text, required: false, i18n: true }
      - { name: preview_image, label: Fotka, widget: image, required: false, i18n: duplicate }
      - name: people
        label: Skupina
        widget: string
        required: false
        i18n: duplicate
        hint: Např. marathon-dj. Seskupuje profily na stránce maratonu.
      - name: llm_mirror
        label: Zrcadlit pro LLM
        widget: boolean
        required: false
        i18n: duplicate
      - { name: body, label: Text, widget: markdown, modes: [raw], i18n: true }

  # Stránky obsahují widget tagy a ruční `url:`/`save_as:` override. Editují se
  # zatím ručně — až po round-trip testu, který prokáže, že uložení stránky
  # s <widget-calendar/> nezmění ani bajt. Marathon sub-web (translate: false)
  # sem taky zatím nepatří.
