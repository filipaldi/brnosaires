{% extends "base.html" %}
{% from "components/widget_processor.html" import process_widgets %}

{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock %}

{% block content %}
<div class="group--main-container">
  <article class="stack gap-m">
    <header>
      <h1 class="text-3xl">{{ page.title }}</h1>
    </header>

    <div class="stack gap-m">
      {{ process_widgets(page.content) }}
    </div>
  </article>
</div>
{% endblock %}
