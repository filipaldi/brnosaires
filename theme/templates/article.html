{% extends "base.html" %}

{% block title %}{{ article.title }} | {{ SITENAME }}{% endblock %}

{% block content %}
<div class="group--main-container">
  <article class="el-stack stack-m">
    <header>
      {% if article.date %}
      <time class="text-s color-neutral-3" datetime="{{ article.date.isoformat() }}">
        {{ article.date.strftime('%d. %m. %Y') }}
      </time>
      {% endif %}
    </header>

    <div class="el-stack stack-xs">
      {{ article.content }}
    </div>
  </article>
</div>
{% endblock %}
