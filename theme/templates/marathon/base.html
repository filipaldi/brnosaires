<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ SITENAME }} - Tango Marathon">
  <title>{% block title %}Tango Marathon | {{ SITENAME }}{% endblock %}</title>
  
  <link rel="preload" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/fonts/brnos-aires.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/fonts/nunito-variable.woff2" as="font" type="font/woff2" crossorigin>
  
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/variables.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/typography.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/core.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/layout.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/spacing.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/aesthetic.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/components.css">
  <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/marathon.css">
  
  {% block head %}{% endblock %}
</head>
<body class="marathon-page">
  <nav class="marathon-navigation">
    <a href="{{ SITEURL }}/tango-marathon.html">Home</a>
    <a href="{{ SITEURL }}/tango-marathon/djs-team.html">DJs</a>
    <a href="{{ SITEURL }}/tango-marathon/venue.html">Venue</a>
    <a href="{{ SITEURL }}/tango-marathon/gallery.html">Gallery</a>
    <a href="{{ SITEURL }}/tango-marathon/schedule.html">Schedule</a>
    <a href="{{ SITEURL }}/tango-marathon/travel.html">Travel</a>
    <a href="{{ SITEURL }}/tango-marathon/visit-and-stay-in-brno.html">Stay</a>
    <a href="https://form.jotform.com/253222851672355" target="_blank">Pre-Registration</a>
  </nav>

  <main class="marathon-content" role="main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
